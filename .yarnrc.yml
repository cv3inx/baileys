# Install into a real node_modules tree instead of Yarn's PnP store.
#
# PnP resolves modules through .pnp.cjs and enforces declared dependencies
# strictly. That is stricter than npm/pnpm and breaks in two ways that matter
# for this package:
#
#   1. Native modules. sharp/better-sqlite3/@napi-rs ship prebuilt binaries and
#      dlopen sibling .so files by relative path (sharp -> libvips-cpp.so). Under
#      PnP those live inside zips or virtual paths, so the dlopen fails with
#      ERR_DLOPEN_FAILED unless every package is unplugged.
#   2. Undeclared transitive deps. Any dependency that requires a package it
#      forgot to declare throws under PnP where npm would silently hoist it.
#
# node_modules is what consumers (npm, pnpm, yarn classic, Docker, pm2 hosts)
# actually use, so installing the same way here keeps local behaviour honest.
nodeLinker: node-modules

# Native prebuilds must be real files on disk for dlopen to find them.
nmMode: hardlinks-local

# This package is consumed as a git dependency, so allow git-hosted installs.
enableGlobalCache: false
